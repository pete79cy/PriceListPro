{% extends 'layout.html' %}

{% block content %}
<div class="row mb-4">
    <div class="col-lg-12">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">AI-Powered Price Search</h5>
            </div>
            <div class="card-body">
                <form id="search-form" class="mb-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="search-query" class="form-label">Search for Product</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-search"></i></span>
                                <input type="text" class="form-control" id="search-query" placeholder="Enter product name, SKU, or description" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="customer-select" class="form-label">Customer</label>
                            <select class="form-select" id="customer-select" required>
                                <option value="" selected disabled>Select a customer</option>
                                {% for customer in customers %}
                                <option value="{{ customer.id }}">{{ customer.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-search me-2"></i> Search
                            </button>
                        </div>
                    </div>
                </form>
                
                <div id="search-spinner" class="text-center my-5 d-none">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Searching for prices...</p>
                </div>
                
                <div id="search-results" class="d-none">
                    <h4 class="mb-3">Search Results</h4>
                    <div id="results-container"></div>
                </div>
                
                <div id="no-results" class="alert alert-info d-none">
                    No results found. Please try a different search term or customer.
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/search.js') }}"></script>
{% endblock %}
