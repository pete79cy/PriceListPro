<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Plant Pricing System{% endblock %}</title>
    <!-- Apple-style Login CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Translucent Header -->
    <header class="login-header">
        <a href="{{ url_for('index') }}" class="brand">
            <i class="fas fa-seedling"></i>
            Plant Pricing System
        </a>
    </header>

    <!-- Main Content -->
    <div class="login-container">
        {% block content %}{% endblock %}
    </div>

    <!-- JavaScript for enhanced interactions -->
    <script>
        // Password visibility toggle
        function togglePassword(button) {
            const input = button.previousElementSibling;
            const icon = button.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Enhanced form validation and submission
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('.login-form');
            const button = document.querySelector('.login-button');
            const inputs = document.querySelectorAll('.form-input');
            
            // Form submission with loading state
            if (form && button) {
                form.addEventListener('submit', function(e) {
                    if (!validateForm()) {
                        e.preventDefault();
                        return;
                    }
                    
                    button.disabled = true;
                    button.classList.add('loading');
                    button.innerHTML = '<span class="spinner"></span>Signing in...';
                    
                    // Re-enable button after timeout to handle errors
                    setTimeout(() => {
                        if (button.disabled) {
                            button.disabled = false;
                            button.classList.remove('loading');
                            button.innerHTML = 'Sign In';
                        }
                    }, 10000);
                });
            }

            // Add focus/blur animation to input fields
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.classList.add('focused');
                    clearFieldError(this);
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.classList.remove('focused');
                    validateField(this);
                });
                
                // Real-time validation
                input.addEventListener('input', function() {
                    clearFieldError(this);
                });
            });
            
            // Auto-focus first empty field
            const firstEmptyInput = Array.from(inputs).find(input => !input.value);
            if (firstEmptyInput) {
                firstEmptyInput.focus();
            }
        });

        // Form validation functions
        function validateForm() {
            const username = document.getElementById('username');
            const password = document.getElementById('password');
            let isValid = true;
            
            if (!username.value.trim()) {
                showFieldError(username, 'Username is required');
                isValid = false;
            } else if (username.value.length < 3) {
                showFieldError(username, 'Username must be at least 3 characters');
                isValid = false;
            }
            
            if (!password.value) {
                showFieldError(password, 'Password is required');
                isValid = false;
            } else if (password.value.length < 6) {
                showFieldError(password, 'Password must be at least 6 characters');
                isValid = false;
            }
            
            return isValid;
        }
        
        function validateField(field) {
            if (field.hasAttribute('required') && !field.value.trim()) {
                showFieldError(field, `${field.labels[0].textContent} is required`);
                return false;
            }
            return true;
        }
        
        function showFieldError(field, message) {
            clearFieldError(field);
            field.classList.add('error');
            
            const errorDiv = document.createElement('div');
            errorDiv.className = 'field-error';
            errorDiv.textContent = message;
            field.parentElement.appendChild(errorDiv);
        }
        
        function clearFieldError(field) {
            field.classList.remove('error');
            const existingError = field.parentElement.querySelector('.field-error');
            if (existingError) {
                existingError.remove();
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // Enter key on form fields
            if (e.key === 'Enter' && e.target.classList.contains('form-input')) {
                const form = e.target.closest('form');
                if (form) {
                    const inputs = form.querySelectorAll('.form-input');
                    const currentIndex = Array.from(inputs).indexOf(e.target);
                    
                    if (currentIndex < inputs.length - 1) {
                        inputs[currentIndex + 1].focus();
                    } else {
                        form.querySelector('.login-button').click();
                    }
                }
            }
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
