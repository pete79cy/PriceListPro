<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Plant Pricing System{% endblock %}</title>
    
    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0b1220">
    
    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PriceListPro">
    <link rel="apple-touch-icon" href="/static/pwa/icons/icon-192.png">
    
    <!-- Apple-style Login CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Translucent Header -->
    <header class="login-header">
        <a href="{{ url_for('index') }}" class="brand">
            <i class="fas fa-seedling"></i>
            Plant Pricing System
        </a>
    </header>

    <!-- Main Content -->
    <div class="login-container">
        {% block content %}{% endblock %}
    </div>

    
    <!-- Service Worker Registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
          try {
            const reg = await navigator.serviceWorker.register("/sw.js");
            reg.update();
          } catch (e) {
            console.warn("SW registration failed", e);
          }
        });
      }
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
