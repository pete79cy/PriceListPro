<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — PriceListPro</title>
    <style>
      body{font-family:system-ui;margin:0;padding:24px;background:#0b1220;color:#e5e7eb}
      .card{max-width:560px;margin:40px auto;padding:20px;border-radius:14px;background:#111827}
      h1{margin-top:0;color:#f9fafb}
      a{color:#93c5fd}
      .icon{font-size:48px;margin-bottom:16px}
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>You're offline</h1>
      <p>PriceListPro can't reach the server right now.</p>
      <p>Try again when you have a connection.</p>
      <p><a href="/">Retry</a></p>
    </div>
  </body>
</html>
