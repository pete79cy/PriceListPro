{% extends 'layout.html' %}

{% block title %}Company Settings{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-12">
            <div class="card my-4 shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0">
                        <i class="fas fa-building me-2"></i> Company Settings
                    </h2>
                </div>
                
                <div class="card-body">
                    <form action="{{ url_for('save_company_settings') }}" method="post" enctype="multipart/form-data">
                        <div class="row mb-4">
                            <div class="col-md-8">
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="name" class="form-label">Company Name</label>
                                        <input type="text" class="form-control" id="name" name="name" value="{{ company.name }}" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="pdf_orientation" class="form-label">PDF Orientation</label>
                                        <select class="form-select" id="pdf_orientation" name="pdf_orientation">
                                            <option value="portrait" {% if company.pdf_orientation == 'portrait' %}selected{% endif %}>Portrait</option>
                                            <option value="landscape" {% if company.pdf_orientation == 'landscape' %}selected{% endif %}>Landscape</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="address_line1" class="form-label">Address Line 1</label>
                                        <input type="text" class="form-control" id="address_line1" name="address_line1" value="{{ company.address_line1 }}">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="address_line2" class="form-label">Address Line 2</label>
                                        <input type="text" class="form-control" id="address_line2" name="address_line2" value="{{ company.address_line2 }}">
                                    </div>
                                </div>
                                
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="phone" class="form-label">Phone</label>
                                        <input type="text" class="form-control" id="phone" name="phone" value="{{ company.phone }}">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="email" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="email" name="email" value="{{ company.email }}">
                                    </div>
                                </div>
                                
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="website" class="form-label">Website</label>
                                        <input type="url" class="form-control" id="website" name="website" value="{{ company.website }}" placeholder="https://www.example.com">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="col-md-4">
                                <div class="card">
                                    <div class="card-header">Company Logo</div>
                                    <div class="card-body text-center">
                                        {% if company.logo_path %}
                                            <img src="{{ url_for('static', filename='uploads/' + company.logo_path.split('/')[-1]) }}" alt="Company Logo" class="img-fluid mb-3" style="max-height: 120px;">
                                        {% else %}
                                            <div class="text-center p-4 bg-light mb-3">
                                                <i class="fas fa-image fa-5x text-secondary"></i>
                                                <p class="text-muted mt-2">No logo uploaded</p>
                                            </div>
                                        {% endif %}
                                        <div class="form-group">
                                            <label for="logo" class="d-block btn btn-outline-primary">
                                                <i class="fas fa-upload me-2"></i> Upload New Logo
                                                <input type="file" id="logo" name="logo" accept="image/*" style="display: none;">
                                            </label>
                                        </div>
                                        <small class="form-text text-muted">Recommended size: 300x100px</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="text-end mt-4">
                            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary me-2">
                                <i class="fas fa-times me-1"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Show file name when selecting a logo
    document.getElementById('logo').addEventListener('change', function(e) {
        const fileName = e.target.files[0]?.name || 'No file selected';
        const label = this.previousElementSibling || this.parentElement;
        label.innerHTML = `<i class="fas fa-upload me-2"></i> ${fileName.length > 20 ? fileName.substring(0, 17) + '...' : fileName}`;
    });
</script>
{% endblock %}
